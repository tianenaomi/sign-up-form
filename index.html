<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP Sign-up Form</title>
    <link rel="stylesheet" href="/resources/style.css">
</head>
<body>
    <div id="leftPanel">
        <div id="leftCtnr">
            <span>N</span>
            <h1 id="logo">RUPURRT&gt;</h1>
        </div>
    </div>

    <form id="rightPanel" action="" method="">
        <div id="topPanel">
            <p>This is not a real fan club, though Rupurrt certainly <em>wishes</em> it was. If this were real, you could sign up below for your chance to win kitty cuddles. Only the <em>luckiest</em> get chosen!</p>
            <p>Sign up meow!</p>
        </div>

        <div id="midPanel">
            <p>Let's do this!</p>
            <div id="midCtnr">
                <p class="card">
                    <label for="name">FIRST NAME *</label>
                    <input type="text" id="name" name="name" pattern="^[a-zA-Z]+(([\-'][a-zA-Z]+)?){0,2}$" required><span></span>
                </p>

                <p class="card">
                    <label for="surname">LAST NAME *</label>
                    <input type="text" id="surname" name="surname" pattern="^[a-zA-Z]+(([\-'][a-zA-Z]+)?){0,2}$" required><span></span>
                </p>

                <p class="card">
                    <label for="email">EMAIL *</label>
                    <input type="email" id="email" name="email" pattern="^\w+([\- .]?\w+)+@[a-z]+([\-]\w+)?\.[a-z]{2,3}(.[a-z]{2,3})?(.[a-z]{2,3})?$" required><span></span>
                </p>

                <p class="card">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" name="phone" pattern="(\+614|\+61 4|614|04)(\d{2})?( )?(\d{3})?( )?(\d{3})?"><span></span>
                </p>

                <p class="card">
                    <label for="password">PASSWORD *</label>
                    <input type="password" id="password" name="password" pattern="^.[^\s]{6,20}$" required><span></span>
                </p>

                <p class="card">
                    <label for="confirm">CONFIRM PASSWORD *</label>
                    <input type="password" id="confirm" name="confirm" pattern="^.[^\s]{6,20}$" required><span></span>
                </p>
            </div>

        </div>
        <div id="btmPanel">
            <button type="submit">Sign me up</button>
            <p>Already in the club? <a href="">Log in</a></p>
        </div>
    </form>
</body>
<script src="resources/script.js"></script>
</html>
